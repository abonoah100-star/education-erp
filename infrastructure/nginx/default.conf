server { listen 80; server_name _; client_max_body_size 20m;
 location /api/ { proxy_pass http://backend:4000/api/v1/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
 location /docs { proxy_pass http://backend:4000/docs; proxy_set_header Host $host; }
 location / { proxy_pass http://frontend:3000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
}
