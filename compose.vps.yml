services:
  backend:
    build: {context: ., dockerfile: apps/backend/Dockerfile}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 4000
    networks: [internal]
    expose: ["4000"]
  frontend:
    build: {context: ., dockerfile: apps/frontend/Dockerfile}
    restart: unless-stopped
    depends_on: [backend]
    networks: [internal]
    expose: ["3000"]
  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on: [frontend, backend]
    ports: ["127.0.0.1:8080:80"]
    volumes: ["./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    networks: [internal]
networks:
  internal:
    external: true
    name: education-erp-internal
